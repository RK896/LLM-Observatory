<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Agent Observatory</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #f8fafc;
    }

    header p {
      margin-top: 8px;
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .card {
      background: #1e2330;
      border: 1px solid #2d3548;
      border-radius: 12px;
      padding: 28px;
      width: 100%;
      max-width: 720px;
    }

    form { display: flex; gap: 10px; }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus { border-color: #6366f1; }

    button {
      padding: 12px 22px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    button:hover { background: #4f46e5; }
    button:disabled { background: #374151; cursor: not-allowed; }

    #status {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #64748b;
      min-height: 20px;
    }

    #result { display: none; margin-top: 24px; }

    .label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 8px;
    }

    .sub-questions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 20px;
    }

    .sub-q {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.88rem;
      color: #94a3b8;
    }

    .answer-box {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 16px;
      font-size: 0.93rem;
      line-height: 1.7;
      color: #e2e8f0;
      white-space: pre-wrap;
    }

    .meta {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .badge {
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: #1f2937;
      color: #6366f1;
      border: 1px solid #374151;
    }

    .error-box {
      background: #1c1011;
      border: 1px solid #7f1d1d;
      border-radius: 8px;
      padding: 16px;
      color: #fca5a5;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>LLM Agent Observatory</h1>
    <p>Research agent with end-to-end Datadog tracing &amp; LLM Observability</p>
  </header>

  <div class="card">
    <form id="queryForm">
      <input
        type="text"
        id="question"
        name="question"
        placeholder="Ask a research question..."
        autocomplete="off"
        required
      />
      <button type="submit" id="submitBtn">Ask</button>
    </form>

    <div id="status"></div>

    <div id="result"></div>
  </div>

  <script>
    const form = document.getElementById('queryForm');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = document.getElementById('question').value.trim();
      if (!question) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Thinking…';
      statusEl.textContent = 'Planning sub-questions…';
      resultEl.style.display = 'none';
      resultEl.innerHTML = '';

      const data = new FormData();
      data.append('question', question);

      try {
        const resp = await fetch('/query', { method: 'POST', body: data });
        const json = await resp.json();

        if (json.error) {
          resultEl.innerHTML = `<div class="error-box">${json.error}</div>`;
        } else {
          const subQHtml = json.sub_questions
            .map(q => `<div class="sub-q">${q}</div>`)
            .join('');

          resultEl.innerHTML = `
            <div class="label">Sub-questions</div>
            <div class="sub-questions">${subQHtml}</div>
            <div class="label">Answer</div>
            <div class="answer-box">${json.answer}</div>
            <div class="meta">
              <span class="badge">${json.latency_ms} ms</span>
              <span class="badge">${json.source_count} sources</span>
            </div>
          `;
        }

        resultEl.style.display = 'block';
        statusEl.textContent = '';
      } catch (err) {
        resultEl.innerHTML = `<div class="error-box">Request failed: ${err.message}</div>`;
        resultEl.style.display = 'block';
        statusEl.textContent = '';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Ask';
      }
    });
  </script>
</body>
</html>
